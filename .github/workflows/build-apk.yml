
name: Build DuePilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Android Manifest
  run: |
    gradle :app:processDebugMainManifest --stacktrace --info > manifest-log.txt 2>&1 || true
    grep -n -i -E -C 3 'error:|fatal|Caused by:|lineNumber|SAXParseException|ManifestMerger' manifest-log.txt | tail -80 || tail -40 manifest-log.txt
    exit 1

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuePilot-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
